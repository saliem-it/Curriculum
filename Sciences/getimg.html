    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: #f0fdf4; color: #0f172a; padding: 2rem 1rem; }
        
        .header-box {
            max-width: 900px;
            margin: 0 auto 2rem;
            text-align: center;
            background: white;
            padding: 2.2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: 2px solid #bbf7d0;
        }

        h1 { font-size: 1.8rem; color: #065f46; margin-bottom: 0.6rem; }
        p { color: #475569; font-size: 1.05rem; margin-bottom: 1.5rem; }

        .btn-download-all {
            background: linear-gradient(135deg, #059669, #0284c7);
            color: white;
            border: none;
            padding: 1.1rem 2.8rem;
            font-size: 1.25rem;
            font-weight: 900;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.35);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
        }

        .btn-download-all:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(5, 150, 105, 0.45);
        }

        #statusText {
            font-size: 1rem;
            font-weight: 700;
            color: #0284c7;
            margin-top: 1rem;
        }

        .gallery-title {
            max-width: 1100px;
            margin: 2rem auto 1rem;
            font-size: 1.3rem;
            font-weight: 900;
            color: #1e293b;
        }

        .gallery-grid {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.2rem;
        }

        .img-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid #e2e8f0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
        }

        .img-card .svg-box {
            width: 100%;
            height: 190px;
            background: #ffffff;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-card svg {
            width: 100%;
            height: 100%;
        }

        .card-details {
            padding: 0.8rem;
            text-align: center;
            background: #fafafa;
        }

        .card-details h4 {
            font-size: 0.95rem;
            color: #0f172a;
            margin-bottom: 0.3rem;
        }

        .card-details code {
            display: block;
            background: #e2e8f0;
            color: #0369a1;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-family: monospace;
            font-weight: bold;
        }
    </style>
</head>

        // ===============================================

        class ZipArchive {
            constructor() { this.files = []; }
            add(name, data) { this.files.push({ name, data }); }
            blob() {
                const crcTable = [];
                for (let n = 0; n < 256; n++) {
                    let c = n;
                    for (let k = 0; k < 8; k++) c = ((c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1));
                    crcTable[n] = c;
                }
                const crc32 = (buf) => {
                    let crc = 0 ^ (-1);
                    for (let i = 0; i < buf.length; i++) crc = (crc >>> 8) ^ crcTable[(crc ^ buf[i]) & 0xFF];
                    return (crc ^ (-1)) >>> 0;
                };

                let parts = [], cparts = [], offset = 0;
                this.files.forEach(f => {
                    const nb = new TextEncoder().encode(f.name);
                    const crc = crc32(f.data);
                    
                    const lh = new Uint8Array(30 + nb.length);
                    const lv = new DataView(lh.buffer);
                    lv.setUint32(0, 0x04034b50, true);
                    lv.setUint16(4, 10, true);
                    lv.setUint32(14, crc, true);
                    lv.setUint32(18, f.data.length, true);
                    lv.setUint32(22, f.data.length, true);
                    lv.setUint16(26, nb.length, true);
                    lh.set(nb, 30);
                    parts.push(lh, f.data);

                    const ch = new Uint8Array(46 + nb.length);
                    const cv = new DataView(ch.buffer);
                    cv.setUint32(0, 0x02014b50, true);
                    cv.setUint16(4, 10, true);
                    cv.setUint16(6, 10, true);
                    cv.setUint32(16, crc, true);
                    cv.setUint32(20, f.data.length, true);
                    cv.setUint32(24, f.data.length, true);
                    cv.setUint16(28, nb.length, true);
                    cv.setUint32(42, offset, true);
                    ch.set(nb, 46);
                    cparts.push(ch);

                    offset += lh.length + f.data.length;
                });

                const csize = cparts.reduce((a, b) => a + b.length, 0);
                const eocd = new Uint8Array(22);
                const ev = new DataView(eocd.buffer);
                ev.setUint32(0, 0x06054b50, true);
                ev.setUint16(8, this.files.length, true);
                ev.setUint16(10, this.files.length, true);
                ev.setUint32(12, csize, true);
                ev.setUint32(16, offset, true);

                return new Blob([...parts, ...cparts, eocd], { type: 'application/zip' });
            }
        }

        // تحويل الـ SVG إلى بايتات JPEG بدقة عالية
        function svgToJpegBytes(svgStr) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = 800;
                canvas.height = 600;
                const ctx = canvas.getContext('2d');
                const img = new Image();
                const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);

                img.onload = () => {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, 800, 600);
                    ctx.drawImage(img, 0, 0, 800, 600);
                    URL.revokeObjectURL(url);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
                    const bstr = atob(dataUrl.split(',')[1]);
                    const u8arr = new Uint8Array(bstr.length);
                    for (let i = 0; i < bstr.length; i++) u8arr[i] = bstr.charCodeAt(i);
                    resolve(u8arr);
                };
                img.src = url;
            });
        }

        async function generateRealZip() {
            const status = document.getElementById('statusText');
            status.textContent = '⏳ جاري تحويل الرسوم العلمية إلى ملفات صور بدقة عالية...';

            const zip = new ZipArchive();

            for (let item of diagrams) {
                const bytes = await svgToJpegBytes(item.svg);
                zip.add(item.name, bytes);
            }

            status.textContent = '📦 تم إنشاء صور حقيقية عالية الدقة، جاري التنزيل...';
            
            const zipBlob = zip.blob();
            const link = document.createElement('a');
            link.href = URL.createObjectURL(zipBlob);
            link.download = 'images.zip';
            link.click();

            status.innerHTML = '✅ <b>تم تنزيل images.zip بنجاح تام وبدون أي أخطاء!</b> فك الضغط عنه وضعه بجانب ملف <code>index.html</code>.';
        }
    </script>
